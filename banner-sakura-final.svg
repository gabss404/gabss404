<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b0f1c"/>
      <stop offset="50%" stop-color="#3d1526"/>
      <stop offset="100%" stop-color="#22101a"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f4a6c1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f4a6c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4a6c1"/>
      <stop offset="50%" stop-color="#e8809f"/>
      <stop offset="100%" stop-color="#f4a6c1"/>
    </linearGradient>
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Simple, clean petal - abstract not literal -->
    <ellipse id="petal" cx="0" cy="0" rx="5" ry="9" fill="#f7b8cf"/>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#centerGlow)"/>

  <!-- Corner petal clusters, abstract confetti-style, not branches -->
  <g opacity="0.8">
    <use xlink:href="#petal" href="#petal" x="70" y="50" transform="rotate(20)"/>
    <use xlink:href="#petal" href="#petal" x="95" y="80" transform="rotate(-15)" opacity="0.7"/>
    <use xlink:href="#petal" href="#petal" x="50" y="95" transform="rotate(60)" opacity="0.6"/>
    <use xlink:href="#petal" href="#petal" x="110" y="40" transform="rotate(-40)" opacity="0.55"/>
    <use xlink:href="#petal" href="#petal" x="40" y="60" transform="rotate(100)" opacity="0.5"/>
  </g>
  <g opacity="0.8">
    <use xlink:href="#petal" href="#petal" x="1130" y="50" transform="rotate(-20)"/>
    <use xlink:href="#petal" href="#petal" x="1105" y="80" transform="rotate(15)" opacity="0.7"/>
    <use xlink:href="#petal" href="#petal" x="1150" y="95" transform="rotate(-60)" opacity="0.6"/>
    <use xlink:href="#petal" href="#petal" x="1090" y="40" transform="rotate(40)" opacity="0.55"/>
    <use xlink:href="#petal" href="#petal" x="1160" y="60" transform="rotate(-100)" opacity="0.5"/>
  </g>
  <g opacity="0.7">
    <use xlink:href="#petal" href="#petal" x="80" y="240" transform="rotate(30)" opacity="0.5"/>
    <use xlink:href="#petal" href="#petal" x="55" y="215" transform="rotate(-25)" opacity="0.45"/>
    <use xlink:href="#petal" href="#petal" x="1120" y="240" transform="rotate(-30)" opacity="0.5"/>
    <use xlink:href="#petal" href="#petal" x="1145" y="215" transform="rotate(25)" opacity="0.45"/>
  </g>

  <!-- Bokeh sparkles -->
  <g fill="#ffe3ee">
    <circle cx="220" cy="35" r="1.8" opacity="0.5"/>
    <circle cx="380" cy="55" r="1.4" opacity="0.4"/>
    <circle cx="820" cy="40" r="1.8" opacity="0.4"/>
    <circle cx="980" cy="60" r="1.4" opacity="0.5"/>
    <circle cx="600" cy="30" r="1.6" opacity="0.4"/>
  </g>

  <!-- Falling petals, drifting, gentle -->
  <g opacity="0.85">
    <use xlink:href="#petal" href="#petal" x="180" y="0" transform="scale(0.8)">
      <animateTransform attributeName="transform" type="translate" from="0,-20" to="35,320" dur="7s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="200" dur="7s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use xlink:href="#petal" href="#petal" x="1000" y="0" transform="scale(0.65)">
      <animateTransform attributeName="transform" type="translate" from="0,-40" to="-30,320" dur="8s" begin="1s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-200" dur="8s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use xlink:href="#petal" href="#petal" x="420" y="0" transform="scale(0.55)">
      <animateTransform attributeName="transform" type="translate" from="0,-60" to="25,320" dur="9s" begin="2s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="200" dur="9s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use xlink:href="#petal" href="#petal" x="780" y="0" transform="scale(0.7)">
      <animateTransform attributeName="transform" type="translate" from="0,-10" to="-20,320" dur="7.5s" begin="0.5s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-200" dur="7.5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use xlink:href="#petal" href="#petal" x="600" y="0" transform="scale(0.5)">
      <animateTransform attributeName="transform" type="translate" from="0,-90" to="15,320" dur="8.5s" begin="3s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="200" dur="8.5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use xlink:href="#petal" href="#petal" x="900" y="0" transform="scale(0.55)">
      <animateTransform attributeName="transform" type="translate" from="0,-30" to="18,320" dur="7.8s" begin="1.5s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="200" dur="7.8s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- Thin gold accent lines, top only -->
  <line x1="0" y1="45" x2="1200" y2="45" stroke="#c9a04e" stroke-width="0.8" opacity="0.3"/>

  <!-- Center panel -->
  <rect x="260" y="88" width="680" height="140" fill="#1a0a12" opacity="0.5" rx="6"/>
  <rect x="260" y="88" width="680" height="140" fill="none" stroke="#c9a04e" stroke-width="1.2" opacity="0.65" rx="6"/>
  <!-- corner accents on panel -->
  <g stroke="#c9a04e" stroke-width="1.5" opacity="0.8">
    <path d="M260,88 L260,104 M260,88 L276,88" fill="none"/>
    <path d="M940,88 L940,104 M940,88 L924,88" fill="none"/>
    <path d="M260,228 L260,212 M260,228 L276,228" fill="none"/>
    <path d="M940,228 L940,212 M940,228 L924,228" fill="none"/>
  </g>

  <!-- Name -->
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#f2e4c9" filter="url(#glowGold)">
    Gabriela Costa
    <animate attributeName="opacity" values="0;1" dur="1.3s" fill="freeze"/>
  </text>

  <!-- Divider -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.45;1" dur="2s" fill="freeze"/>
    <line x1="500" y1="170" x2="560" y2="170" stroke="#c9a04e" stroke-width="1"/>
    <circle cx="600" cy="170" r="2" fill="#c9a04e"/>
    <line x1="640" y1="170" x2="700" y2="170" stroke="#c9a04e" stroke-width="1"/>
  </g>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="3.5" fill="#f7b8cf" opacity="0" filter="url(#glowPink)">
    JAVA BACKEND DEVELOPER
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.55;1" dur="2.6s" fill="freeze"/>
  </text>

  <!-- Animated wavy cutout border at the bottom -->
  <path fill="url(#waveGrad)" opacity="0.85">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="
      M0,300 L0,280 C100,260 200,300 300,280 C400,260 500,300 600,280 C700,260 800,300 900,280 C1000,260 1100,300 1200,280 L1200,300 Z;
      M0,300 L0,280 C100,300 200,260 300,280 C400,300 500,260 600,280 C700,300 800,260 900,280 C1000,300 1100,260 1200,280 L1200,300 Z;
      M0,300 L0,280 C100,260 200,300 300,280 C400,260 500,300 600,280 C700,260 800,300 900,280 C1000,260 1100,300 1200,280 L1200,300 Z
      "/>
  </path>
  <path fill="none" stroke="#f2e4c9" stroke-width="1.2" opacity="0.5">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="
      M0,280 C100,260 200,300 300,280 C400,260 500,300 600,280 C700,260 800,300 900,280 C1000,260 1100,300 1200,280;
      M0,280 C100,300 200,260 300,280 C400,300 500,260 600,280 C700,300 800,260 900,280 C1000,300 1100,260 1200,280;
      M0,280 C100,260 200,300 300,280 C400,260 500,300 600,280 C700,260 800,300 900,280 C1000,260 1100,300 1200,280
      "/>
  </path>
</svg>
